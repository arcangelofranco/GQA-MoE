# NANO preset: 19,811,328 parameters.

model:
  vocab_size: 8000
  n_layers: 12
  n_heads: 8
  n_kv_heads: 2
  head_dim: 32
  expert_intermediate: 256
  shared_intermediate: 688
  n_experts: 4
  top_k: 2
  max_seq_len: 1024
  rms_norm_eps: 1.0e-6
  rope_theta: 10000.0
  aux_loss_coeff: 0.01
  tie_embeddings: true

train:
  batch_size: 16
  block_size: 512
  target_tokens: 400_000_000
  warmup_steps: 500
  max_lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 500
  eval_iters: 50
  seed: 1337

runtime:
  log_every: 10
  checkpoint_every: 1000